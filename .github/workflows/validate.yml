name: Validate evidence
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-optional.txt
      - run: python -m unittest discover -s tests -q
      - run: node --check aclbrief/static/app.js
      - run: node tests/test_ui_filters.js
      - run: python examples/verify_evidence.py
      - run: python examples/verify_gpt_workflow.py
